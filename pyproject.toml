[project]
name = "agent-ledger"
version = "0.1.0"
description = "Reference ledger for agent spend caps, escrow, and reputation from settled jobs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joe" }]
keywords = ["agents", "escrow", "ledger", "grok"]

[project.scripts]
agent-ledger = "agent_ledger.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
